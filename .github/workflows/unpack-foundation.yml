
name: Unpack FEEDSURGE foundation

on:
  push:
    branches:
      - 'feedsurge/rebuild-foundation-2026-11-21'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract foundation ZIP
        run: |
          ZIP="feedsurge:rebuild-foundation-2026-11-21.zip"
          test -f "$ZIP"
          mkdir -p /tmp/feedsurge-foundation
          unzip -oq "$ZIP" -d /tmp/feedsurge-foundation
          cp -a /tmp/feedsurge-foundation/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract FEEDSURGE foundation files"
            git push
          else
            echo "No new files to commit."
          fi
