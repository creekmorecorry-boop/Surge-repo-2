:root{
  --navy:#111827;
  --navy-2:#111827;
  --cyan:#00D4FF;
  --blue:#0090FF;
  --blue-2:#0090FF;
  --purple:#4B2EDB;
  --ink:#111111;
  --heading:#111111;
  --muted:#666666;
  --line:#e5e8f0;
  --brand:linear-gradient(135deg,#00D4FF 0%,#0090FF 48%,#4B2EDB 100%);
  --brand-soft:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,144,255,.12) 50%,rgba(75,46,219,.14));
  --page:#f4f6fb;
  --safe-area-inset-top:0px;
  color-scheme:light;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:#f4f6fb;
  color:#111111;
  font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
  overflow:auto;
  height:auto
}

.onboarding,.onboarding-wrap{
  height:auto;
  min-height:100dvh;
  overflow-y:auto;
  overflow-x:visible;
  -webkit-overflow-scrolling:touch
}

.onboarding .input{
  min-height:56px
}

button,input,textarea,select{
  font:inherit;
  color-scheme:light
}

button{
  cursor:pointer
}

a{
  color:#0090FF;
  text-decoration:none
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#d5dae6;
  border-radius:99px
}

.grad{
  background:var(--brand)
}

.grad-text{
  background:var(--brand);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.card{
  background:#ffffff !important;
  border:1px solid #e5e8f0;
  box-shadow:0 10px 28px rgba(17,24,39,.06);
  color:#111111
}

.chip{
  border:1px solid #e5e8f0;
  background:#ffffff !important;
  color:#111111
}

.input{
  width:100%;
  background:#ffffff !important;
  border:1px solid #e5e8f0 !important;
  border-radius:14px;
  padding:13px 14px;
  color:#111111 !important;
  outline:none
}

.input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,212,255,.22)
}

.input::-moz-placeholder{
  color:#666666
}

.input::placeholder{
  color:#666666
}

select.input option{
  background:#ffffff;
  color:#111111
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.video-tile{
  background:linear-gradient(115deg,#00D4FF 0%,#0090FF 42%,#1A4DFF 68%,#4B2EDB 100%)
}

.video-tile-2{
  background:linear-gradient(115deg,#7DD8FF 0%,#4BA3FF 35%,#1A4DFF 68%,#7A5CFF 100%)
}

.video-tile-3{
  background:linear-gradient(115deg,#00E5FF 0%,#0090FF 38%,#5B4DFF 72%,#B07CFF 100%)
}

.video-tile-4{
  background:linear-gradient(115deg,#A5E8FF 0%,#0090FF 38%,#6D6CFF 68%,#4B2EDB 100%)
}

.video-tile-5{
  background:linear-gradient(115deg,#00D4FF 0%,#3D7BFF 40%,#8B5CF6 75%,#4B2EDB 100%)
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.rise{
  animation:rise .35s ease both
}

@keyframes load{
  from{
    width:8%
  }

  to{
    width:92%
  }
}

.loadbar{
  animation:load 1.6s ease forwards
}

@media (prefers-color-scheme: dark){
  :root{
    --navy:#111827;
    --ink:#111111;
    --muted:#666666;
    --page:#f4f6fb
  }

  html,body{
    background:#f4f6fb;
    color:#111111
  }
}

@media (prefers-color-scheme: light){
  :root{
    --navy:#111827;
    --ink:#111111;
    --muted:#666666;
    --page:#f4f6fb
  }

  html,body{
    background:#f4f6fb;
    color:#111111
  }
}
