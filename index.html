  --brand-grad:linear-gradient(135deg,#00D4FF 0%,#0090FF 48%,#4B2EDB 100%);
  --dark:#05060a;
  --glass:rgba(255,255,255,.86);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05060a;
    --surface:#0d0f16;
    --surface-2:#171a24;
    --ink:#f8fafc;
    --muted:#9aa3b2;
    --hairline:#232736;
  }
}

*{
  -webkit-tap-highlight-color:transparent;
  box-sizing:border-box;
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color:var(--ink);
  letter-spacing:-.02em;
}

button{
  font:inherit;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

.snap-y{
  scroll-snap-type:y mandatory;
}

.snap-item{
  scroll-snap-align:start;
  scroll-snap-stop:always;
}

@keyframes burst{
  0%{
    transform:scale(.4);
    opacity:1
  }

  60%{
    transform:scale(1.5);
    opacity:.9
  }

  100%{
    transform:scale(2.1);
    opacity:0
  }
}

@keyframes pop{
  0%{
    transform:scale(.82)
  }

  55%{
    transform:scale(1.08)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes shimmer{
  0%{
    background-position:-400px 0
  }

  100%{
    background-position:400px 0
  }
}

@keyframes floatIn{
  from{
    opacity:0;
    transform:translateY(14px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes surgePulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.07)
  }
}

.burst{
  animation:burst .55s ease-out forwards;
}

.pop{
  animation:pop .28s ease-out;
}

.float-in{
  animation:floatIn .45s ease-out both;
}

.shimmer{
  background:linear-gradient(90deg,#eef0f3 25%,#fff 50%,#eef0f3 75%);
  background-size:800px 100%;
  animation:shimmer 1.4s infinite;
}

.brand-grad{
  background:var(--brand-grad);
}

.brand-text{
  background:var(--brand-grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
}

.hairline{
  border-color:var(--hairline);
}

.line-clamp-2{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.placeholder\:text-white\/40::-moz-placeholder {
  color: rgb(255 255 255 / 0.4);
}

.placeholder\:text-white\/40::placeholder {
  color: rgb(255 255 255 / 0.4);
}

.hover\:bg-gray-50:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(249 250 251 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
}

.focus\:border-\[\#0090FF\]:focus {
  --tw-border-opacity: 1;
  border-color: rgb(0 144 255 / var(--tw-border-opacity, 1));
}

.active\:scale-90:active {
  --tw-scale-x: .9;
  --tw-scale-y: .9;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:scale-95:active {
  --tw-scale-x: .95;
  --tw-scale-y: .95;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:scale-\[\.98\]:active {
  --tw-scale-x: .98;
  --tw-scale-y: .98;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:scale-\[\.99\]:active {
  --tw-scale-x: .99;
  --tw-scale-y: .99;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:bg-white\/20:disabled {
  background-color: rgb(255 255 255 / 0.2);
}

.disabled\:text-white\/40:disabled {
  color: rgb(255 255 255 / 0.4);
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

.group:hover .group-hover\:opacity-100 {
  opacity: 1;
}

@media (min-width: 640px) {
  .sm\:items-center {
    align-items: center;
  }

  .sm\:rounded-\[28px\] {
    border-radius: 28px;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:text-\[28px\] {
    font-size: 28px;
  }
}
</style>
