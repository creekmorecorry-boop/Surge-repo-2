</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEEDSURGE</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f2f6ff;color:#111}
.wrap{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;padding:32px 20px}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#1ea2ff,#7b5cff);display:grid;place-items:center;font-size:34px;color:#fff;margin:10px auto}
h1{text-align:center;font-size:24px;margin:12px 0 4px} p{text-align:center;color:#64748b;font-size:13px;margin:0 0 22px}
label{font-size:12px;font-weight:700;color:#475569} input{width:100%;padding:14px;border:1px solid #dbe4f0;border-radius:12px;background:#eef4ff;margin:6px 0 14px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:999px;background:linear-gradient(90deg,#1ea2ff,#7b5cff);color:#fff;font-weight:800;font-size:16px}
#msg{white-space:pre-wrap;font-size:13px;color:#334155;margin-top:14px;text-align:center}
#ok{display:none;text-align:center} #ok h2{font-size:22px} .out{width:100%;padding:14px;border:0;border-radius:999px;background:#e2e8f0;color:#111;font-weight:700;margin-top:14px}
</style></head>
<body><div class="wrap">
<div id="login">
<div class="logo">⚡</div>
<h1>FEEDSURGE</h1><p>Sign in</p>
<label>EMAIL</label><input id="email" value="creekmorecorey2@gmail.com" autocomplete="email">
<label>PASSWORD</label><input id="pw" type="password" placeholder="Your password" autocomplete="current-password">
<button id="btn">Sign In</button>
<div id="msg"></div>
</div>
<div id="ok"><div class="logo">✓</div><h2>You're in.</h2><p id="who"></p><button class="out" id="logout">Log Out</button></div>
</div>
<script>
const BASE='https://feedsurge-api-dev.onrender.com';
const msg=document.getElementById('msg');
const btn=document.getElementById('btn');
btn.onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('pw').value;
 if(!email||!password){msg.textContent='Enter email + password.';return;}
 btn.disabled=true; btn.textContent='Signing in...'; msg.textContent='Contacting server... (Render can take up to 60s if asleep)';
 try{
  const res=await fetch(BASE+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){msg.textContent='Login failed: '+(data.message||data.error||('Status '+res.status));btn.disabled=false;btn.textContent='Sign In';return;}
  const access=data.access_token||data.session?.access_token||'';
  const refresh=data.refresh_token||data.session?.refresh_token||'';
  if(!access){msg.textContent='Server said OK but gave no token.';btn.disabled=false;btn.textContent='Sign In';return;}
  localStorage.setItem('feedsurge_access_token',access);
  if(refresh) localStorage.setItem('feedsurge_refresh_token',refresh);
  document.getElementById('login').style.display='none';
  document.getElementById('ok').style.display='block';
  document.getElementById('who').textContent='Signed in as '+email;
 }catch(e){msg.textContent='Could not reach server. Wait 60s and try again.';btn.disabled=false;btn.textContent='Sign In';}
};
document.getElementById('logout').onclick=()=>{
 localStorage.removeItem('feedsurge_access_token');localStorage.removeItem('feedsurge_refresh_token');
 document.getElementById('ok').style.display='none';document.getElementById('login').style.display='block';
 document.getElementById('pw').value='';btn.disabled=false;btn.textContent='Sign In';msg.textContent='Logged out.';
};
// If already have a token, skip login
if(localStorage.getItem('feedsurge_access_token')){
 document.getElementById('login').style.display='none';document.getElementById('ok').style.display='block';
 document.getElementById('who').textContent='Signed in as '+document.getElementById('email').value;
}
