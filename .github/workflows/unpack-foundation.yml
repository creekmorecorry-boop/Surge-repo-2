
name: Install FEEDSURGE complete package

on:
  push:
    branches:
      - 'feedsurge/rebuild-foundation-2026-11-21'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rebuild branch
        uses: actions/checkout@v4
        with:
          ref: feedsurge/rebuild-foundation-2026-11-21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract complete package
        run: |
          set -euo pipefail
          ARCHIVE=".github/workflows/FEEDSURGE-REBUILD-COMPLETE-PASS47.zip"
          test -f "$ARCHIVE"
          unzip -o "$ARCHIVE" -d .
          rm -f "$ARCHIVE"

      - name: Verify backend syntax
        run: |
          node --check feedsurge-api.js
          node --check backend/server.js

      - name: Run regression tests
        run: npm test

      - name: Commit installed application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .github/workflows/unpack-foundation.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install complete FEEDSURGE Pass 47 rebuild"
            git push origin HEAD:feedsurge/rebuild-foundation-2026-11-21
          fi
